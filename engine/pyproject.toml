[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texora-engine"
version = "0.1.0"
description = "Texora offline OCR engine sidecar (FastAPI + Uvicorn)."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
readme = "../README.md"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.11.2",
]

[tool.setuptools]
packages = ["texora_engine", "texora_engine.api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["texora_engine", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: Depends/Security in argument defaults is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["texora_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
