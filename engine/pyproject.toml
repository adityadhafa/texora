[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "texora-engine"
version = "0.1.0"
description = "Texora offline OCR engine sidecar (FastAPI + Uvicorn)."
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
readme = "../README.md"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    # HTTP client for the M2 model downloader (promoted from dev to runtime).
    "httpx==0.28.1",
    # Formula OCR model + runtime (M2). The +cpu torch wheels come from the
    # PyTorch CPU index; see engine/requirements.txt for the install command.
    "pix2tex==0.1.4",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "pillow==10.4.0",
    "pylatexenc==2.10",
    "latex2mathml==3.77.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff==0.6.9",
    "black==24.10.0",
    "mypy==1.11.2",
]

[tool.setuptools]
packages = [
    "texora_engine",
    "texora_engine.api",
    "texora_engine.db",
    "texora_engine.ensemble",
    "texora_engine.export",
    "texora_engine.ingest",
    "texora_engine.layout",
    "texora_engine.models",
    "texora_engine.pipeline",
    "texora_engine.recognizers",
]
# Ship the generated KaTeX allow-list alongside the ensemble package.
[tool.setuptools.package-data]
"texora_engine.ensemble" = ["katex_allowlist.json"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["texora_engine", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection idiom: Depends/Security in argument defaults is intentional.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["texora_engine"]

# Third-party ML/OCR libraries without published type stubs. We keep our own
# code strictly typed but cannot type-check across these boundaries.
[[tool.mypy.overrides]]
module = [
    "pix2tex.*",
    "torch.*",
    "PIL.*",
    "pylatexenc.*",
    "latex2mathml.*",
    "munch",
    "yaml",
    "pypdfium2.*",
    "pillow_heif.*",
    "cv2.*",
    "onnxruntime.*",
    "doclayout_yolo.*",
    "pytesseract.*",
    "pyclipper.*",
    "shapely.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "model: test requires downloaded model weights; skip-with-reason when absent (never mocked).",
    "latex: test requires a TeX toolchain (latexmk); xfail-skips locally, asserted in CI.",
]
