# Texora Release — builds the Windows installer and publishes it to a GitHub Release.
#
# Trigger: push a version tag like `v0.1.0`. GitHub's windows-latest runner (not your
# machine) freezes the Python engine with PyInstaller, runs `tauri build` to produce the
# .msi / .exe installers, and attaches them to a GitHub Release for that tag.
#
# Versions are pinned to match the project toolchain (Python 3.11.9, Node 24.x, Rust
# stable, pnpm 9.15.9) exactly as in .github/workflows/ci.yml.
#
# To cut a release:
#   git tag v0.1.0
#   git push origin v0.1.0
# The workflow then builds and publishes the installers automatically.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build a release for (e.g. v0.1.0). Must already exist."
        required: true
        type: string

# The release job needs write access to create the Release and upload assets.
permissions:
  contents: write

jobs:
  build-release:
    name: Build and publish Windows installer
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Set up pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"

      - name: Set up Node 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install engine build dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Freeze engine sidecar (PyInstaller)
        run: python scripts/build_engine.py --python python --triple x86_64-pc-windows-msvc

      - name: Build Tauri installer
        run: pnpm --filter desktop tauri build

      - name: Collect installer artifacts
        run: |
          mkdir -p dist
          cp apps/desktop/src-tauri/target/release/bundle/msi/*.msi dist/ 2>/dev/null || true
          cp apps/desktop/src-tauri/target/release/bundle/nsis/*.exe dist/ 2>/dev/null || true
          echo "Collected installers:"
          ls -la dist/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # On a tag push, the tag name is used automatically; for manual runs,
          # fall back to the provided input tag.
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Texora ${{ github.event.inputs.tag || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.msi
            dist/*.exe
