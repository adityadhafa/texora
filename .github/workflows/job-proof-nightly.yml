name: Job proof (nightly 5,000-page)

# M4 DoD-1/2 proof (design §12): the streaming job runner's invariants — flat memory and crash-safe
# resume with no lost/duplicate pages — proven at the FULL 5,000-page count on a schedule. The same
# assertions run locally at a SCALED count (docs/m4-verification.md); this nightly job is the full
# gate. The synthetic PDF is a REAL document generated by scripts/make_synthetic_pdf.py; nothing is
# faked. reportlab/psutil are the test/CI-only deps (the [test] extra), never shipped.

on:
  schedule:
    - cron: "0 5 * * *" # 05:00 UTC nightly
  workflow_dispatch:
    inputs:
      pages:
        description: "Synthetic page count for the memory proof"
        default: "5000"
      resume_pages:
        description: "Synthetic page count for the interrupt/resume proof"
        default: "5000"

permissions:
  contents: read

jobs:
  job-proof:
    name: 5,000-page memory + resume proof
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    env:
      # Full 5,000-page count by default; a manual dispatch may override via inputs.
      TEXORA_PROOF_PAGES: ${{ github.event.inputs.pages || '5000' }}
      TEXORA_PROOF_RESUME_PAGES: ${{ github.event.inputs.resume_pages || '5000' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Install engine + test-extra dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e ".[test]"

      - name: Run the 5,000-page job proof (memory-flat + interrupt-resume)
        working-directory: ${{ github.workspace }}
        run: python -m pytest benchmarks/job_proof -q
