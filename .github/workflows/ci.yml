name: CI

# Texora M1 CI — builds the Windows installer and runs engine + frontend checks.
# All jobs run on windows-latest (MSVC toolchain preinstalled); every action and tool
# version is pinned per docs/PROGRESS.md (Python 3.11.9, Node 24.x, Rust stable, pnpm 9.15.9).

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine-checks:
    name: Engine checks (ruff / black / mypy / pytest)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: black --check (line length 100)
        run: black --check . --line-length 100

      - name: mypy
        run: mypy texora_engine

      - name: pytest
        run: pytest -q

  frontend-checks:
    name: Frontend checks (lint / test / build)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"

      - name: Set up Node 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter desktop lint

      - name: Test
        run: pnpm --filter desktop test -- --run

      - name: Build frontend
        run: pnpm --filter desktop build

  build-installer:
    name: Build Windows installer
    runs-on: windows-latest
    needs: [engine-checks, frontend-checks]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python 3.11.9
        uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"

      - name: Set up pnpm 9.15.9
        uses: pnpm/action-setup@v4
        with:
          version: "9.15.9"

      - name: Set up Node 24.x
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          cache: pnpm

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Install engine build dependencies
        working-directory: engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Freeze engine sidecar (PyInstaller)
        run: python scripts/build_engine.py --python python --triple x86_64-pc-windows-msvc

      - name: Build Tauri installer
        run: pnpm --filter desktop tauri build

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: texora-windows-installer
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
